name: MCP protocol
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test mcp/server.test.mjs
      - run: node --check mcp/server.mjs
      - run: node --check mcp/autocad.mjs
      - run: node --check mcp/sketchup.mjs
      - run: node --check scripts/bim-agent-cli.mjs
      - run: node scripts/bim-agent-cli.mjs revit list
      - run: node scripts/bim-agent-cli.mjs autocad list
      - run: node scripts/bim-agent-cli.mjs sketchup list
      - run: node -e "JSON.parse(require('fs').readFileSync('capabilities.json', 'utf8'))"
      - shell: pwsh
        run: ./scripts/package-sketchup.ps1
